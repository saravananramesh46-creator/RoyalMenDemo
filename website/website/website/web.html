
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlassBook - Online Book Store</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<header class="header">
    <div class="logo">📚 GlassBook</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#books">Books</a>
        <button onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
        
<!-- RIGHT CORNER MY PROFILE -->

    <img
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300"
        alt="My Profile"
        class="profile-photo"
    >

    <h3>My Profile</h3>
    <p class="profile-name">Your Name</p>
    <p class="profile-phone">📞 +91 98765 43210</p>

    <div class="profile-buttons">
        <a href="tel:+919876543210">📞 Call</a>
        <a href="https://wa.me/919876543210" target="_blank">WhatsApp</a>
    </div>
</div>

    </nav>
</header>

<section class="hero" id="home">
    <h1>Welcome to GlassBook</h1>
    <p>Discover your next favourite book.</p>
    <a href="#books" class="hero-btn">Explore Books</a>
</section>

<main class="container" id="books">
    <h2>Our Book Collection</h2>

    <div class="filters">
        <input type="text" id="searchInput" placeholder="Search books..." oninput="filterBooks()">

        <select id="categoryFilter" onchange="filterBooks()">
            <option value="All">All Categories</option>
            <option value="Fiction">Fiction</option>
            <option value="Science">Science</option>
            <option value="Technology">Technology</option>
            <option value="History">History</option>
            <option value="Business">Business</option>
        </select>
    </div>

    <p id="resultCount"></p>

    <div class="book-grid" id="bookContainer"></div>

    <div class="pagination">
        <button id="prevBtn" onclick="changePage(-1)">❮ Previous</button>
        <div id="pageNumbers"></div>
        <button id="nextBtn" onclick="changePage(1)">Next ❯</button>
    </div>
    <p id="pageInfo"></p>
</main>

<!-- BOOK READER -->
<div class="modal" id="readerModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('readerModal')">✕</button>
        <div id="readerDetails"></div>
    </div>
</div>

<!-- CART -->
<div class="modal" id="cartModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('cartModal')">✕</button>
        <h2>🛒 Your Shopping Cart</h2>
        <div id="cartItems"></div>
        <h3>Total: ₹<span id="cartTotal">0</span></h3>
        <button class="main-btn" onclick="openBilling()">Proceed to Billing</button>
    </div>
</div>

<!-- BILLING -->
<div class="modal" id="billingModal">
    <div class="modal-content">
        <button class="close" onclick="closeModal('billingModal')">✕</button>
        <h2>Customer Billing</h2>

        <form id="billingForm">
            <input id="customerName" placeholder="Customer Name" required>
            <input id="customerPhone" placeholder="Phone Number" required>
            <textarea id="customerAddress" placeholder="Address" required></textarea>
            <div id="billingSummary"></div>
            <button class="main-btn" type="submit">Generate Invoice</button>
        </form>
    </div>
</div>

<!-- INVOICE -->
<div class="modal" id="invoiceModal">
    <div class="modal-content invoice">
        <button class="close" onclick="closeModal('invoiceModal')">✕</button>
        <div id="invoiceDetails"></div>
        <button class="main-btn no-print" onclick="window.print()">Print / Save PDF</button>
    </div>
</div>

<footer>
    <p>© 2026 GlassBook | Your Online Book Store</p>
</footer>

<script src="script.js"></script>
</body>
</html>
